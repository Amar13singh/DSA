<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic NavBar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 40px;
      background-image: url('https://cdn.dribbble.com/userupload/6508149/file/original-c4197a5bf25a4356aa2bac6f82073eb2.jpg?resize=752x&vertical=center'); /* your image here */

      background-size: cover;
      background-position: center;
      position: relative;
      z-index: 1;
    }

    .navbar::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      height: 100%; width: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-right: 30px;
      font-size: 18px;
      position: relative;
      padding-bottom: 5px;
      transition: color 0.3s;
    }

    .navbar a:hover,
    .navbar a.active {
      border-bottom: 2px solid white;
      cursor: pointer;
    }

    .login-button {
      margin-left: auto;
      border: 2px solid white;
      padding: 5px 15px;
      border-radius: 6px;
    }

    #content {
      padding: 40px;
      background: #ffffff;
      margin: 30px auto;
      width: 80%;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      border-radius: 10px;
    }

    h2 {
      color: #333;
    }

    p {
      font-size: 16px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a class="nav-link active" onclick="loadContent('home', this)">Home</a>
    <a class="nav-link" onclick="loadContent('about', this)">About</a>
    <a class="nav-link" onclick="loadContent('services', this)">Services</a>
    <a class="nav-link" onclick="loadContent('contact', this)">Contact</a>
    <a class="login-button" href="#">Login</a>
  </div>

  <div id="content">
    <h2>Welcome!</h2>
    <p>Click a menu item to load dynamic content below.</p>
  </div>

  <script>
    const contentMap = {
      home: {
        title: "Home Content Loaded",
        text: "This is the dynamic content for the Home section. Welcome to our homepage!"
      },
      about: {
        title: "About Us",
        text: "We are a passionate team focused on delivering quality services to our users."
      },
      services: {
        title: "Our Services",
        text: "We offer a range of services tailored to your needs, from consulting to support."
      },
      contact: {
        title: "Contact Us",
        text: "Reach out to us at support@example.com or call us at (123) 456-7890."
      }
    };

    function loadContent(section, element) {
      // Update content
      const content = contentMap[section];
      document.getElementById("content").innerHTML = `
        <h2>${content.title}</h2>
        <p>${content.text}</p>
      `;

      // Set active class
      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
      element.classList.add('active');
    }
  </script>

</body>
</html>
