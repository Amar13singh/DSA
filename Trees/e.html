<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Website with Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('background.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100%;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 40px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-right: 30px;
      font-size: 18px;
      position: relative;
      padding-bottom: 5px;
      transition: color 0.3s;
    }

    .navbar a:hover,
    .navbar a.active {
      border-bottom: 2px solid white;
      cursor: pointer;
    }

    .login-button {
      margin-left: auto;
      border: 2px solid white;
      padding: 5px 15px;
      border-radius: 6px;
    }

    #content {
      padding: 40px;
      margin: 30px auto;
      width: 80%;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      color: white;
    }

    /* Login form styles */
    .login-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      color: black;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-container h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #2c5364;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #2c5364;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #2c5364;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease-in-out;
    }

    .submit-btn:hover {
      background-color: #203a43;
    }

    .bottom-text {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .bottom-text a {
      color: #2c5364;
      text-decoration: none;
      font-weight: 600;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="overlay"></div>
  <div class="container">
    <div class="navbar">
      <a class="nav-link active" onclick="loadContent('home', this)">Home</a>
      <a class="nav-link" onclick="loadContent('about', this)">About</a>
      <a class="nav-link" onclick="loadContent('services', this)">Services</a>
      <a class="nav-link" onclick="loadContent('contact', this)">Contact</a>
      <a class="login-button" onclick="loadLogin()">Login</a>
    </div>

    <div id="content">
      <h2>Welcome!</h2>
      <p>Click a menu item to load dynamic content below.</p>
    </div>
  </div>

  <script>
    const contentMap = {
      home: {
        title: "Home Content Loaded",
        text: "This is the dynamic content for the Home section. Welcome to our homepage!"
      },
      about: {
        title: "About Us",
        text: "We are a passionate team focused on delivering quality services to our users."
      },
      services: {
        title: "Our Services",
        text: "We offer a range of services tailored to your needs, from consulting to support."
      },
      contact: {
        title: "Contact Us",
        text: "Reach out to us at support@example.com or call us at (123) 456-7890."
      }
    };

    function loadContent(section, element) {
      const content = contentMap[section];
      document.getElementById("content").innerHTML = `
        <h2>${content.title}</h2>
        <p>${content.text}</p>
      `;

      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
      element.classList.add('active');
    }

    function loadLogin() {
      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));

      document.getElementById("content").innerHTML = `
        <div class="login-container">
          <h2>Login to MyApp</h2>
          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label for="username">Email or Username</label>
              <input type="text" id="username" placeholder="Enter your email or username" required>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
            <div class="bottom-text">
              Don't have an account? <a href="#">Sign Up</a>
            </div>
          </form>
        </div>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "admin" && password === "admin123") {
        alert("Login successful!");
        loadContent("home", document.querySelector(".nav-link"));
      } else {
        alert("Invalid username or password.");
      }
    }
  </script>

</body>
</html>
